<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400">
<rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#25364d;font-size:15px}.axis{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}.dim{stroke:#7b8797;stroke-width:1.5}.arm{stroke:#cc5c3b;stroke-width:9;stroke-linecap:round}</style>
<text x="25" y="32" font-size="22" font-weight="bold">EchoBeat M2 — one arm, side view (concept)</text>
<!-- y scaled as x, front left; z scaled -->
<rect x="90" y="316" width="540" height="18" fill="#dae3ef" stroke="#44546d" stroke-width="2"/>
<text x="640" y="329" font-size="12">BASE</text>
<rect x="220" y="260" width="168" height="56" fill="#e6cba4" stroke="#75654e" stroke-width="2"/>
<line x1="220" y1="260" x2="388" y2="260" stroke="#64748b" stroke-width="6"/>
<text x="303" y="288" text-anchor="middle">DRUM PAD</text>
<!-- servo axis corresponding 70 y back from pad => 210px right, z difference 32 => 96px up -->
<rect x="460" y="138" width="82" height="104" rx="9" fill="#4f6483"/>
<circle cx="512" cy="164" r="13" fill="white" stroke="#344b6a" stroke-width="3"/>
<line x1="512" y1="164" x2="305" y2="248" class="arm"/>
<circle cx="305" cy="248" r="12" fill="#b5c3d0" stroke="#415569" stroke-width="2"/>
<line x1="512" y1="164" x2="297" y2="194" stroke="#d89e8f" stroke-width="7" stroke-dasharray="8 7"/>
<text x="410" y="124" text-anchor="middle">Rest: about 8°</text>
<text x="416" y="217" text-anchor="middle">Strike: about 22°</text>
<line x1="512" y1="164" x2="610" y2="164" class="dim"/><text x="615" y="160" class="small">Axis z=56</text>
<line x1="388" y1="260" x2="625" y2="260" class="dim"/><text x="630" y="265" class="small">Pad z=24</text>
<text x="35" y="375" class="small">75 mm effective striker reach. Drawing not to scale; calibrate servo angles before attaching arms.</text>
</svg>